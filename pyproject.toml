[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datnvt-cvat-cli"
version = "0.1.0"
description = "CLI and Python API for managing CVAT annotations: download, upload, and inspect tasks"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
keywords = ["cvat", "annotations", "computer-vision", "cli", "dataset"]
authors = [{ name = "datnvt", email = "thanhdatnv2712@gmail.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "requests>=2.28.0",
    "pydantic>=2.0.0",
    "typer>=0.9.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=3.0.0",
    "ruff>=0.4.0",
]

[tool.ruff]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E203", "E501", "E722"]

[project.scripts]
datnvt-cvat-cli = "datnvt_cvat_cli.cli:main_cli"

[project.urls]
Homepage = "https://github.com/datvtn/datnvt-cvat-cli"
"Bug Tracker" = "https://github.com/datvtn/datnvt-cvat-cli/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["datnvt_cvat_cli*"]
